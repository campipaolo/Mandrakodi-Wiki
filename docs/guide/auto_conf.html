<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP Config Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0369a1; }
        #status { margin-top: 1rem; font-size: 0.9rem; font-weight: 500; }
        .success { color: #4ade80; }
        textarea {
            width: 100%;
            height: 220px;
            margin-top: 1rem;
            background-color: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            resize: vertical;
            display: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>WARP Config Generator</h1>
    <p>Genera e scarica automaticamente la configurazione WireGuard pulita (.conf) per il tuo dispositivo.</p>
    
    <button id="genBtn" onclick="generateConfig()">Genera & Scarica .conf</button>
    <div id="status"></div>
    <textarea id="preview" readonly></textarea>
</div>

<script>
// Generazione locale della chiave privata WireGuard (senza server/API)
function generatePrivateKey() {
    const array = new Uint8Array(32);
    window.crypto.getRandomValues(array);
    array[0] &= 248;
    array[31] &= 127;
    array[31] |= 64;
    return btoa(String.fromCharCode.apply(null, array));
}

function generateConfig() {
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    
    // 1. Genera la chiave privata direttamente nel browser
    const privateKey = generatePrivateKey();
    
    // 2. Compone la configurazione con l'Endpoint corretto (engage.cloudflareclient.com:2408) e l'MTU = 1280
    const cleanConf = `[Interface]
PrivateKey = ${privateKey}
MTU = 1280
Address = 172.16.0.2/32, 2606:4700:110:8005:9078:90d:60de:211b/128
DNS = 1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001

[Peer]
PublicKey = bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = engage.cloudflareclient.com:2408`;

    // 3. Mostra la preview a schermo
    preview.value = cleanConf;
    preview.style.display = 'block';

    // 4. Avvia il download immediato del file .conf
    const blob = new Blob([cleanConf], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'WARP.conf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    status.className = 'success';
    status.innerText = '✅ Configurazione generata e salvata!';
}
</script>

</body>
</html>
