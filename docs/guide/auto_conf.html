<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP to WireGuard Converter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; font-weight: 500; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        textarea {
            width: 100%;
            height: 180px;
            margin-top: 1rem;
            background-color: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            resize: vertical;
            display: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>WARP Config Generator</h1>
    <p>Genera e scarica automaticamente la configurazione WireGuard pulita (.conf) per il tuo dispositivo.</p>
    
    <button id="genBtn" onclick="generateAndDownload()">Genera & Scarica .conf</button>
    <div id="status"></div>
    <textarea id="preview" readonly></textarea>
</div>

<script>
async function generateAndDownload() {
    const btn = document.getElementById('genBtn');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    
    btn.disabled = true;
    status.className = '';
    status.innerText = 'Generazione in corso...';
    preview.style.display = 'none';

    try {
        // Generazione della chiave privata e pubblica WireGuard locale via Web Crypto API
        const keyPair = await window.crypto.subtle.generateKey(
            { name: "X25519" },
            true,
            ["deriveKey", "deriveBits"]
        );
        
        // Per compatibilità immediata senza librerie esterne complesse, richiamiamo le API di supporto Cloudflare
        const regResponse = await fetch('https://api.cloudflareclient.com/v0i1909051800/reg', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ install_id: "", tos: new Date().toISOString() })
        });

        if (!regResponse.ok) throw new Error('Errore durante la comunicazione con Cloudflare');

        const data = await regResponse.json();
        
        // Estrazione e pulizia dati (Formattazione WireGuard)
        const privKey = data.config.interface.addresses.private_key || "<Inserisci_La_Tua_PrivateKey>";
        const ipv4 = data.config.interface.addresses.v4;
        const ipv6 = data.config.interface.addresses.v6;
        const pubKey = "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="; // Cloudflare WARP Public Key
        const endpoint = "162.159.192.1:2408";

        const cleanConf = `[Interface]
PrivateKey = ${privKey}
Address = ${ipv4}/32, ${ipv6}/128
DNS = 1.1.1.1, 1.0.0.1, 2606:4700:4700::1111

[Peer]
PublicKey = ${pubKey}
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = ${endpoint}`;

        // Mostra la preview del testo pulito
        preview.value = cleanConf;
        preview.style.display = 'block';

        // Download automatico del file .conf
        const blob = new Blob([cleanConf], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'WARP.conf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        status.className = 'success';
        status.innerText = '✅ File WARP.conf scaricato con successo!';
    } catch (err) {
        console.error(err);
        status.className = 'error';
        status.innerText = '❌ Errore durante la generazione. Riprova.';
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
