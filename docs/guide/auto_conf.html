<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WARP Config Generator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0369a1; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; font-weight: 500; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        textarea {
            width: 100%;
            height: 220px;
            margin-top: 1rem;
            background-color: #0f172a;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 10px;
            font-family: monospace;
            font-size: 0.8rem;
            resize: vertical;
            display: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>WARP Config Generator</h1>
    <p>Genera e scarica automaticamente la configurazione WireGuard pulita (.conf) per il tuo dispositivo.</p>
    
    <button id="genBtn" onclick="generateConfig()">Genera & Scarica .conf</button>
    <div id="status"></div>
    <textarea id="preview" readonly></textarea>
</div>

<script>
// Generazione di chiavi trasparenti Curve25519 per WireGuard
function generatePrivateKey() {
    const array = new Uint8Array(32);
    window.crypto.getRandomValues(array);
    array[0] &= 248;
    array[31] &= 127;
    array[31] |= 64;
    return btoa(String.fromCharCode.apply(null, array));
}

async function generateConfig() {
    const btn = document.getElementById('genBtn');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');
    
    btn.disabled = true;
    status.className = '';
    status.innerText = 'Generazione ed estrazione parametri in corso...';
    preview.style.display = 'none';

    try {
        const privateKey = generatePrivateKey();
        
        // Registrazione tramite l'API backend nativa di Vercel senza proxy esterni intermedi
        const response = await fetch('https://warp-generator.vercel.app/api/reg', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                key: privateKey,
                install_id: "",
                fcm_token: "",
                tos: new Date().toISOString(),
                model: "PC",
                type: "Android",
                locale: "en_US"
            })
        });

        if (!response.ok) throw new Error('Errore durante la comunicazione con il server');

        const data = await response.json();
        
        // Estrazione degli IP reali restituiti da Cloudflare
        const ipv4 = data.result?.config?.interface?.addresses?.v4 || data.config?.interface?.addresses?.v4 || "172.16.0.2";
        const ipv6 = data.result?.config?.interface?.addresses?.v6 || data.config?.interface?.addresses?.v6 || "2606:4700:110:8005:9078:90d:60de:211b";
        const peerPubKey = data.result?.config?.peers[0]?.public_key || data.config?.peers[0]?.public_key || "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=";
        
        // Endpoint e parametri identici al file wireguard.conf funzionante
        const endpoint = "engage.cloudflareclient.com:2408";

        // Composizione della configurazione WireGuard
        const cleanConf = `[Interface]
PrivateKey = ${privateKey}
Address = ${ipv4}, ${ipv6}
MTU = 1280
DNS = 1.1.1.1, 1.0.0.1, 2606:4700:4700::1111, 2606:4700:4700::1001

[Peer]
PublicKey = ${peerPubKey}
AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = ${endpoint}`;

        // Mostra preview
        preview.value = cleanConf;
        preview.style.display = 'block';

        // Download del file .conf
        const blob = new Blob([cleanConf], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'WARP.conf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        status.className = 'success';
        status.innerText = '✅ Configurazione generata e salvata con successo!';
    } catch (err) {
        console.error(err);
        status.className = 'error';
        status.innerText = '❌ Errore durante la registrazione. Riprova.';
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
