name: Aggiorna Eventi EPG

on:
  schedule:
    - cron: '0 */6 * * *'  # Esegue ogni 6 ore
  workflow_dispatch:        # Permette il lancio manuale da pulsante Web

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: FONDAMENTALE - Scarica il repository sulla macchina virtuale
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      # STEP 2: Configura l'ambiente Python
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # STEP 3: Installa le librerie
      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # STEP 4: Stampa la struttura per debug e lancia lo script
      - name: Esegui get_events.py
        run: |
          ls -la
          python get_events.py

      # STEP 5: Fa il commit e invia il file JSON su GitHub
      - name: Commit e Push delle modifiche
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add events.json docs/calendario/events.json || true
          git commit -m "Auto-update events.json" || exit 0
          git push
