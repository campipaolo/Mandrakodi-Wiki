name: Sync With Test

on:
  push:
    branches:
      - main

jobs:
  sincronizzazione:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizza repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force https://${{ secrets.TEST_SYNC }}@github.com/campipaolo/Sync.git main
