name: Sync With Test

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync to Target Repo
        uses: wei/git-sync@v3
        with:
          source_repo: "campipaolo/Mandrakodi-Wiki"
          source_branch: "main"
          destination_repo: "https://x-access-token:${{ secrets.Test_Sync }}@github.com/campipaolo/Sync.git"
          destination_branch: "main"
