name: Sync With Test

on:
  push:
    branches:
      - main

jobs:
  sincronizzazione:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Esegui Sync su repository Sync
        run: |
          git config --global user.name "campipaolo"
          git config --global user.email "campipaolo@users.noreply.github.com"
          git push --force "https://campipaolo:${{ secrets.TEST_SYNC }}@github.com/campipaolo/Sync.git" main:main
