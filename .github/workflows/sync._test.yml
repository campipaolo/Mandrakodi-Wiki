name: Sync With Test

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push diretto su Sync
        env:
          GITHUB_TOKEN: ${{ secrets.Test_Sync }}
        run: |
          git remote add target "https://x-access-token:${GITHUB_TOKEN}@github.com/campipaolo/Sync.git"
          git push --force target main
