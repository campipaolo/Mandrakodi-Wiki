name: Mirror WgTunnel APKs Automatically

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for new version and Download
        run: |
          python3 -c '
          import urllib.request
          import json
          import sys
          import os
          import re

          upstream_api = "https://api.github.com/repos/wgtunnel/android/releases/latest"
          local_release_api = "https://api.github.com/repos/campipaolo/Mandrakodi-Wiki/releases/tags/Files"
          headers = {"User-Agent": "Mozilla/5.0"}

          def fetch_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read().decode())

          try:
              upstream_data = fetch_json(upstream_api)
          except Exception as e:
              print(f"Error fetching upstream release: {e}")
              sys.exit(1)

          latest_tag = upstream_data.get("tag_name", "").strip()
          print(f"Latest upstream version: {latest_tag}")

          current_version = None
          try:
              local_data = fetch_json(local_release_api)
              body = local_data.get("body", "") or ""
              match = re.search(r"Versione:\s*(\S+)", body)
              if match:
                  current_version = match.group(1).strip()
              print(f"Current mirrored version in release Files: {current_version}")
          except Exception as e:
              print(f"Could not read existing Files release version (will proceed): {e}")

          if latest_tag and current_version == latest_tag:
              print("Already up to date. Skipping download and upload.")
              with open(os.environ["GITHUB_ENV"], "a") as env_file:
                  env_file.write("SHOULD_UPLOAD=false\n")
              sys.exit(0)

          arm64_url = None
          armv7_url = None

          for asset in upstream_data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")
              if "arm64" in name and name.endswith(".apk"):
                  arm64_url = url
              elif "armv7" in name and name.endswith(".apk"):
                  armv7_url = url

          if not arm64_url or not armv7_url:
              print("Error: Required APK assets not found!")
              sys.exit(1)

          print("Downloading ARM64...")
          urllib.request.urlretrieve(arm64_url, "wgtunnel_64bit.apk")

          print("Downloading ARMV7...")
          urllib.request.urlretrieve(armv7_url, "wgtunnel_32bit.apk")

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"WGTUNNEL_VERSION={latest_tag}\n")
              env_file.write("SHOULD_UPLOAD=true\n")

          print("Download completed successfully.")
          '

      - name: Upload to Release 'Files'
        if: env.SHOULD_UPLOAD == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Files
          files: |
            wgtunnel_64bit.apk
            wgtunnel_32bit.apk
          body: "Versione: ${{ env.WGTUNNEL_VERSION }}"
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
