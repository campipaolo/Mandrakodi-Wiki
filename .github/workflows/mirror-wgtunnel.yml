name: Mirror WgTunnel APKs

on:
  schedule:
    # Esegue il controllo ogni giorno alle 08:00 (puoi modificarlo a piacimento)
    - cron: '0 8 * * *'
  workflow_dispatch: # Permette l'avvio manuale dalla scheda "Actions" di GitHub

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necessario per pubblicare e modificare i file nella Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest release info from wgtunnel/android
        id: fetch_release
        run: |
          API_URL="https://api.github.com/repos/wgtunnel/android/releases/latest"
          echo "Fetching release from $API_URL"
          
          # Scarica il JSON della release e usa node/python o curl/jq nativo per estrarre i link
          RESPONSE=$(curl -s "$API_URL")
          
          # Estrae i browser_download_url per arm64 e armv7 usando python (già preinstallato su runner)
          echo "download_urls<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" | python3 -c '
import sys, json
data = json.load(sys.stdin)
for asset in data.get("assets", []):
    name = asset.get("name", "")
    url = asset.get("browser_download_url", "")
    if "arm64" in name and name.endswith(".apk"):
        print(f"ARM64_URL={url}")
    elif "armv7" in name and name.endswith(".apk"):
        print(f"ARMV7_URL={url}")
' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download and Rename APKs
        run: |
          # Carica le variabili dall output dello step precedente
          eval "${{ steps.fetch_release.outputs.download_urls }}"
          
          echo "Downloading ARM64: $ARM64_URL"
          curl -L -o wgtunnel_64bit.apk "$ARM64_URL"
          
          echo "Downloading ARMV7: $ARMV7_URL"
          curl -L -o wgtunnel_32bit.apk "$ARMV7_URL"
          
          ls -la wgtunnel_*.apk

      - name: Upload to Release 'Files'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: Files
          files: |
            wgtunnel_64bit.apk
            wgtunnel_32bit.apk
          body: "Aggiornamento automatico dei file APK di WgTunnel dall'ultima versione ufficiale."
          overwrite: true # Sovrascrive i file esistenti se hanno lo stesso nome
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
