<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convertitore Configurazione WireGuard</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f6f8fa;
      color: #24292e;
    }
    h1 {
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 10px;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    textarea {
      width: 100%;
      height: 220px;
      font-family: monospace;
      padding: 10px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      background-color: #2da44e;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #2c974b;
    }
    button.secondary {
      background-color: #0969da;
    }
    button.secondary:hover {
      background-color: #0860c4;
    }
    input[type="file"] {
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <h1>Convertitore AmneziaWG/WARP &rarr; WireGuard Standard</h1>
  <p>Incolla la tua configurazione o carica il file <code>.conf</code> per rimuovere i parametri amnezia (S1, S2, Jc, Jmin, Jmax, H1-H4).</p>

  <div class="container">
    <div>
      <label for="fileInput"><strong>Carica un file .conf:</strong></label><br>
      <input type="file" id="fileInput" accept=".conf,.txt">
    </div>

    <div>
      <label for="inputConfig"><strong>Configurazione Input:</strong></label>
      <textarea id="inputConfig" placeholder="Incolla qui il contenuto del file .conf..."></textarea>
    </div>

    <div class="buttons">
      <button onclick="cleanConfig()">Converti in WireGuard Standard</button>
    </div>

    <div>
      <label for="outputConfig"><strong>Configurazione Convertita (WireGuard Standard):</strong></label>
      <textarea id="outputConfig" readonly placeholder="Il risultato apparirà qui..."></textarea>
    </div>

    <div class="buttons">
      <button class="secondary" id="downloadBtn" style="display: none;" onclick="downloadConf()">Scarica wireguard.conf</button>
    </div>
  </div>

  <script>
    // Caricamento file locale
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('inputConfig').value = e.target.result;
      };
      reader.readAsText(file);
    });

    // Funzione di pulizia delle righe non necessarie
    function cleanConfig() {
      const input = document.getElementById('inputConfig').value;
      
      // Lista di chiavi da rimuovere (AmneziaWG / extra parameters)
      const ignoredKeys = ['S1', 'S2', 'Jc', 'Jmin', 'Jmax', 'H1', 'H2', 'H3', 'H4'];

      const lines = input.split(/\r?\n/);
      const filteredLines = lines.filter(line => {
        const trimmed = line.trim();
        // Conserva righe vuote o commenti
        if (!trimmed || trimmed.startsWith('#') || trimmed.startsWith('[')) {
          return true;
        }
        // Estrai la chiave prima del carattere '='
        const key = trimmed.split('=')[0].trim();
        return !ignoredKeys.includes(key);
      });

      const output = filteredLines.join('\n');
      document.getElementById('outputConfig').value = output;

      if (output.trim().length > 0) {
        document.getElementById('downloadBtn').style.display = 'inline-block';
      }
    }

    // Funzione per scaricare il file pulito
    function downloadConf() {
      const text = document.getElementById('outputConfig').value;
      const blob = new Blob([text], { type: 'text/plain' });
      const anchor = document.createElement('a');
      anchor.download = 'wireguard.conf';
      anchor.href = window.URL.createObjectURL(blob);
      anchor.click();
      window.URL.revokeObjectURL(anchor.href);
    }
  </script>

</body>
</html>
